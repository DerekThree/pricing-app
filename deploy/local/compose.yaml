name: pricing-app

services:
  postgres:
    image: postgres:16
    container_name: pricing-postgres
    environment:
      POSTGRES_DB: pricingdb
      POSTGRES_USER: pricinguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/local/.env}
      ACCOUNT_PASSWORD: ${ACCOUNT_PASSWORD:?Set ACCOUNT_PASSWORD in deploy/local/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pricinguser -d pricingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: pricing-backend
    build: ../../pricing-backend
    container_name: pricing-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricingdb
      SPRING_DATASOURCE_USERNAME: pricinguser
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mock-server:
    image: pricing-mock-server
    build: ../../pricing-mock-server
    container_name: pricing-mock-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountdb
      SPRING_DATASOURCE_USERNAME: accountuser
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_PASSWORD}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dashboard:
    image: pricing-dashboard
    build: ../../pricing-dashboard
    container_name: pricing-dashboard
    environment:
      API_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
      mock-server:
        condition: service_healthy

volumes:
  postgres-data:
