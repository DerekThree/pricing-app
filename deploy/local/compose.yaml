name: pricing-app

services:
  postgres:
    image: postgres:16
    container_name: pricing-postgres
    environment:
      POSTGRES_DB: pricingdb
      POSTGRES_USER: pricinguser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/local/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pricinguser -d pricingdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: pricing-backend
    build:
      context: ../..
      dockerfile: pricing-backend/Dockerfile
    container_name: pricing-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricingdb
      SPRING_DATASOURCE_USERNAME: pricingdb_backend
      SPRING_DATASOURCE_PASSWORD: ${BACKEND_PASSWORD:?Set BACKEND_PASSWORD in deploy/local/.env}
    ports:
      - "8080:8080"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mock-server:
    image: pricing-mock-server
    build:
      context: ../..
      dockerfile: pricing-mock-server/Dockerfile
    container_name: pricing-mock-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/accountdb
      SPRING_DATASOURCE_USERNAME: accountdb_mock_server
      SPRING_DATASOURCE_PASSWORD: ${MOCK_SERVER_PASSWORD:?Set MOCK_SERVER_PASSWORD in deploy/local/.env}
      ENGINE_WAKE_UP_URL: http://engine:8082/api/v1/work-available
    ports:
      - "8081:8081"
    depends_on:
      engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  engine:
    image: pricing-engine
    build:
      context: ../..
      dockerfile: pricing-engine/Dockerfile
    container_name: pricing-engine
    environment:
      INITIALIZATION_USERNAME: pricinguser
      INITIALIZATION_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricingdb
      SPRING_DATASOURCE_USERNAME: pricingdb_engine
      SPRING_DATASOURCE_PASSWORD: ${ENGINE_PASSWORD:?Set ENGINE_PASSWORD in deploy/local/.env}
      CONFIGURATION_STORE_BACKEND_USERNAME: pricingdb_backend
      CONFIGURATION_STORE_BACKEND_PASSWORD: ${BACKEND_PASSWORD}
      ACCOUNT_STORE_URL: jdbc:postgresql://postgres:5432/accountdb
      ACCOUNT_STORE_USERNAME: accountdb_engine
      ACCOUNT_STORE_PASSWORD: ${ACCOUNT_PASSWORD:?Set ACCOUNT_PASSWORD in deploy/local/.env}
      ACCOUNT_STORE_MOCK_SERVER_USERNAME: accountdb_mock_server
      ACCOUNT_STORE_MOCK_SERVER_PASSWORD: ${MOCK_SERVER_PASSWORD}
      RECOMMENDATION_STORE_URL: jdbc:postgresql://postgres:5432/recommendationdb
      RECOMMENDATION_STORE_USERNAME: recommendationdb_engine
      RECOMMENDATION_STORE_PASSWORD:
        ${RECOMMENDATION_PASSWORD:?Set RECOMMENDATION_PASSWORD in deploy/local/.env}
      RECOMMENDATION_STORE_TXN_PROCESSOR_USERNAME: recommendationdb_txn_processor
      RECOMMENDATION_STORE_TXN_PROCESSOR_PASSWORD:
        ${TXN_PROCESSOR_PASSWORD:?Set TXN_PROCESSOR_PASSWORD in deploy/local/.env}
      TRANSACTION_PROCESSOR_WAKE_UP_URL: http://mock-server:8081/api/v1/mock/txn/wake
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8082/openapi.yaml"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  dashboard:
    image: pricing-dashboard
    build: ../../pricing-dashboard
    container_name: pricing-dashboard
    environment:
      BACKEND_API_URL: http://localhost:8080
      ACCOUNT_PROCESSOR_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    depends_on:
      engine:
        condition: service_healthy
      backend:
        condition: service_healthy
      mock-server:
        condition: service_healthy

volumes:
  postgres-data:
